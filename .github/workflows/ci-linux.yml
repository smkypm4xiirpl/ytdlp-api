name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YTDLP_TEST_MEDIA_BIN_DIR: /usr/bin
      FFMPEG_PATH: /usr/bin
      FFPROBE_PATH: /usr/bin/ffprobe
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg and FFprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Install locked dependencies
        run: npm ci

      - name: Check source syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Run tests
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/ytdlp-test-output.txt" 2>&1
          test_status=$?
          cat "$RUNNER_TEMP/ytdlp-test-output.txt"
          if [ "$test_status" -ne 0 ]; then
            node --input-type=module - "$RUNNER_TEMP/ytdlp-test-output.txt" <<'NODE'
          import { readFileSync } from 'node:fs';
          const lines = readFileSync(process.argv[2], 'utf8').split(/\r?\n/);
          for (let index = 0; index < lines.length; index += 1) {
            if (!/^not ok \d+ - /.test(lines[index])) continue;
            const excerpt = lines.slice(index, index + 24).join('\n').slice(0, 6000);
            const escaped = excerpt.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::error title=Node test failure::${escaped}`);
          }
          NODE
          fi
          exit "$test_status"
